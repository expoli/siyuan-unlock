name: Release Docker Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "release version/tag"
        required: true

jobs:
  credentials:
    name: check docker credentials
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Check Docker Hub credentials
        id: check
        shell: bash
        env:
          DOCKER_HUB_USER: ${{ secrets.DOCKER_HUB_USER }}
          DOCKER_HUB_PWD: ${{ secrets.DOCKER_HUB_PWD }}
        run: |
          if [[ -n "${DOCKER_HUB_USER}" && -n "${DOCKER_HUB_PWD}" ]]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "enabled=false" >> "${GITHUB_OUTPUT}"
          echo "::notice::Skipping the Docker image build: DOCKER_HUB_USER and DOCKER_HUB_PWD are not configured in this repository."

  build:
    name: build
    runs-on: ubuntu-latest
    needs: credentials
    if: needs.credentials.outputs.enabled == 'true'

    permissions:
      packages: write
      contents: read

    steps:
      - name: Verify release repository
        shell: bash
        env:
          OFFICIAL_BUILD_MARKER: ${{ secrets.SIYUAN_UNLOCK_OFFICIAL_BUILD }}
          OFFICIAL_REPOSITORY: appdev/siyuan-unlock
          RELEASE_REPOSITORIES: appdev/siyuan-unlock expoli/siyuan-unlock
        run: |
          if [[ " ${RELEASE_REPOSITORIES} " != *" ${GITHUB_REPOSITORY} "* ]]; then
            echo "::error::This release workflow can only run in: ${RELEASE_REPOSITORIES}."
            exit 1
          fi

          if [[ "${GITHUB_REPOSITORY}" == "${OFFICIAL_REPOSITORY}" && -z "${OFFICIAL_BUILD_MARKER}" ]]; then
            echo "::error::Official releases require the SIYUAN_UNLOCK_OFFICIAL_BUILD marker secret."
            exit 1
          fi

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          # this might remove tools that are actually needed,
          # if set to "true" but frees about 6 GB
          tool-cache: false

          # all of these default to true, but feel free to set to
          # "false" if necessary for your workflow
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: actions/checkout@v4
        with:
          path: siyuan-note

      - name: clone origin and apply patches
        run: |
          mkdir -p ${{ github.workspace }}/go
          cd ${{ github.workspace }}/siyuan-note/

          git clone --branch ${{ github.event.inputs.version }} --depth=1 https://github.com/siyuan-note/siyuan.git
          cd siyuan

          git apply ${{ github.workspace }}/siyuan-note/patches/siyuan/disable-update.patch
          git apply ${{ github.workspace }}/siyuan-note/patches/siyuan/default-config.patch
          git apply ${{ github.workspace }}/siyuan-note/patches/siyuan/mock-vip-user.patch
          if [[ "${{ github.event.inputs.version }}" == "v3.8.3" ]]; then
            git apply ${{ github.workspace }}/siyuan-note/patches/siyuan/account-v3.8.3.patch
          else
            git apply ${{ github.workspace }}/siyuan-note/patches/siyuan/hide-account-entry.patch
          fi

          git status

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_PWD }}

      - name: Build the Docker image
        working-directory: ${{ github.workspace }}/siyuan-note/siyuan
        run: |
          docker buildx build --push --platform linux/amd64,linux/arm64,linux/arm/v7,linux/arm/v8 -t ${{ env.DOCKER_HUB_USER }}/siyuan-unlock:latest -t ${{ env.DOCKER_HUB_USER }}/siyuan-unlock:${{ github.event.inputs.version }} .
        env:
          DOCKER_HUB_USER: ${{ secrets.DOCKER_HUB_USER }}
